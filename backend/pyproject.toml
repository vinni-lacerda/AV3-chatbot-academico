[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "passa-o-bastao-backend"
version = "0.1.0"
description = "Backend do chatbot Passa o Bastão (Clean Architecture Agnóstica + SOLID + Flask + MongoDB)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "pymongo==4.20.0",
    "PyJWT==2.15.1",
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "mongomock==4.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
